name: build terminal.svg

on:
  push:
    branches: [main]
    paths:
      - scripts/gen_terminal.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate
        run: python3 scripts/gen_terminal.py

      - name: Commit if changed
        run: |
          git add assets/terminal.svg
          if git diff --cached --quiet; then
            echo "terminal.svg is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate terminal.svg"
          git push
